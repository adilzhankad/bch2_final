name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

env:
  FOUNDRY_PROFILE: default

jobs:
  build:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build
        run: forge build --sizes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Solidity format
        run: forge fmt

      - name: Solidity format check
        run: forge fmt --check

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Install solhint
        run: npm install -g solhint

      - name: Solhint
        run: solhint 'src/**/*.sol' --config .solhint.json

      - name: Frontend Prettier format
        run: npx prettier --write "frontend/src/**/*.{ts,tsx}"

      - name: Frontend Prettier check
        run: npx prettier --check "frontend/src/**/*.{ts,tsx}"

  test:
    name: Unit + Fuzz + Invariant Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run tests
        run: forge test -vv --fuzz-seed 12345
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Coverage
        run: forge coverage --report summary | tee coverage/coverage-report.md

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/coverage-report.md

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: |
          slither . \
            --config-file slither.config.json \
            --filter-paths "lib/,test/" \
            --exclude-informational \
            --fail-medium
