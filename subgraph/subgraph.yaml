specVersion: 1.0.0
description: DeFi Super-App — AMM, Lending, Vault, Governance on Optimism Sepolia
repository: https://github.com/your-org/bch2-final
schema:
  file: ./schema.graphql

dataSources:
  # ── PoolFactory ─────────────────────────────────────────────────────────────
  - kind: ethereum
    name: PoolFactory
    network: optimism-sepolia
    source:
      address: "0x07Ae07f70E337Fa545Cd46f1FAe3F00B2Ae8Dd0D"
      abi: PoolFactory
      startBlock: 43690837
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - ProtocolStats
      abis:
        - name: PoolFactory
          file: ./abis/PoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,address,uint256,bool)
          handler: handlePoolCreated
      file: ./src/poolFactory.ts

  # ── LendingPool ─────────────────────────────────────────────────────────────
  - kind: ethereum
    name: LendingPool
    network: optimism-sepolia
    source:
      address: "0x24826A3081984aeBB141A14E6BA6312682e455d2"
      abi: LendingPool
      startBlock: 43690837
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LendingDeposit
        - LendingWithdrawal
        - Borrow
        - Repay
        - Liquidation
        - ProtocolStats
      abis:
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: Deposited(indexed address,indexed address,uint256)
          handler: handleDeposited
        - event: Withdrawn(indexed address,indexed address,uint256)
          handler: handleWithdrawn
        - event: Borrowed(indexed address,indexed address,indexed address,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,indexed address,indexed address,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed address,indexed address,indexed address,address,uint256,uint256)
          handler: handleLiquidated
      file: ./src/lendingPool.ts

  # ── YieldVault (UUPS proxy — track proxy address, not implementation) ────────
  - kind: ethereum
    name: YieldVault
    network: optimism-sepolia
    source:
      address: "0x60BD1A570477e538F60e0F0B1F1222b629F02d84"
      abi: YieldVault
      startBlock: 43690837
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - VaultWithdrawal
        - YieldInjection
        - ProtocolStats
      abis:
        - name: YieldVault
          file: ./abis/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
        - event: YieldInjected(indexed address,uint256)
          handler: handleYieldInjected
      file: ./src/yieldVault.ts

  # ── DeFiGovernor ────────────────────────────────────────────────────────────
  - kind: ethereum
    name: DeFiGovernor
    network: optimism-sepolia
    source:
      address: "0xbBFeB60EdAa64B7726Bcfd5c67EDAc0d3536D54C"
      abi: DeFiGovernor
      startBlock: 43690837
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: DeFiGovernor
          file: ./abis/DeFiGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
      file: ./src/governor.ts

  # ── ProtocolNFT ─────────────────────────────────────────────────────────────
  - kind: ethereum
    name: ProtocolNFT
    network: optimism-sepolia
    source:
      address: "0x43c3Cf94517e7d8b528fF3dc8C4540334c711572"
      abi: ProtocolNFT
      startBlock: 43690837
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NFTMint
      abis:
        - name: ProtocolNFT
          file: ./abis/ProtocolNFT.json
      eventHandlers:
        - event: Minted(indexed address,indexed uint256,string)
          handler: handleMinted
      file: ./src/protocolNft.ts

# ── AMMPool template — one instance per pool created by the factory ───────────
templates:
  - kind: ethereum
    name: AMMPool
    network: optimism-sepolia
    source:
      abi: AMMPool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
        - Pool
        - ProtocolStats
      abis:
        - name: AMMPool
          file: ./abis/AMMPool.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
        - event: Sync(uint256,uint256)
          handler: handleSync
      file: ./src/ammPool.ts
